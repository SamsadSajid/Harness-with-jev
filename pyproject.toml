[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jev-routing-harness"
version = "0.1.0"
description = "A conservative, explainable multi-model harness routed by TypeSafe Jev"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  # Python 3.9 uses the documented HTTPS fallback in jev.py.
  "typesafe-sdk>=0.6.0,<0.8; python_version >= '3.10'",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pytest>=8.0", "httpx>=0.27"]

[project.scripts]
jev-router = "jev_router.cli:main"
jev-router-api = "jev_router.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
