[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jev-routing-harness"
version = "0.1.0"
description = "A conservative, explainable multi-model harness routed by TypeSafe Jev"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["typesafe-sdk>=0.6.0,<0.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jev-router = "jev_router.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
